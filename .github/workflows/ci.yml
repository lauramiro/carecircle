name: CI

on:
  push:
    branches:
      - main
      - develop
      - CC-18-EPIC-4-CI-CD-Security-Documentation
  pull_request:

jobs:
  frontend:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://carecircle-ci.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-anon-key
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  backend:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_TEST_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_TEST_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_TEST_SUBJECT }}
          VAPID_TEST_ENDPOINT: ${{ secrets.VAPID_TEST_ENDPOINT }}
          VAPID_TEST_P256DH: ${{ secrets.VAPID_TEST_P256DH }}
          VAPID_TEST_AUTH: ${{ secrets.VAPID_TEST_AUTH }}
        run: npm run test