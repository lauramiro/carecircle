name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
      - CC-18-EPIC-4-CI-CD-Security-Documentation
      - CC-97-Notifications
      - CC-194-195-frontend-api-base-url-and-branding-fixes
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: E2E — API smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API smoke tests
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_TEST_GROUP_ID: ${{ secrets.E2E_TEST_GROUP_ID }}
        run: npx playwright test --project=api-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
