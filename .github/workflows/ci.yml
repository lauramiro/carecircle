name: CI

on:
  push:
    branches:
      - main
      - develop
      - CC-18-EPIC-4-CI-CD-Security-Documentation
      - CC-116-GA-Pipelines
  pull_request:

jobs:
  frontend:
    name: Frontend - CI Pipeline
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://carecircle-ci.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-anon-key
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test -- --reporter=default --reporter=junit --outputFile=unit-test-results.xml

      - name: Integration Tests
        run: npm run test:integration -- --reporter=default --reporter=junit --outputFile=integration-test-results.xml

      - name: Build
        run: npm run build

      - name: Publish Test Summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "frontend/*-test-results.xml"

  backend:
    name: Backend - CI Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_TEST_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_TEST_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_TEST_SUBJECT }}
          VAPID_TEST_ENDPOINT: ${{ secrets.VAPID_TEST_ENDPOINT }}
          VAPID_TEST_P256DH: ${{ secrets.VAPID_TEST_P256DH }}
          VAPID_TEST_AUTH: ${{ secrets.VAPID_TEST_AUTH }}
        run: npm run test -- --reporter=default --reporter=junit --outputFile=unit-test-results.xml

      - name: Integration Tests
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_TEST_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_TEST_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_TEST_SUBJECT }}
          VAPID_TEST_ENDPOINT: ${{ secrets.VAPID_TEST_ENDPOINT }}
          VAPID_TEST_P256DH: ${{ secrets.VAPID_TEST_P256DH }}
          VAPID_TEST_AUTH: ${{ secrets.VAPID_TEST_AUTH }}
        run: npm run test:e2e -- --reporter=default --reporter=junit --outputFile=e2e-test-results.xml

      - name: Build
        run: npm run build

      - name: Publish Test Summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "backend/*-test-results.xml"