name: Deploy

on:
  workflow_run:
    workflows: ["CI", "E2E Tests"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Render
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check CI and E2E have both succeeded for this commit
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const required = ['CI', 'E2E Tests'];
            let ready = true;

            for (const name of required) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
              });
              const run = data.workflow_runs
                .filter((r) => r.name === name)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                core.info(`"${name}" is not a completed success yet for ${sha} (found: ${run?.conclusion ?? 'no run'})`);
                ready = false;
                break;
              }
            }

            core.setOutput('ready', ready ? 'true' : 'false');

      - name: Deploy backend
        if: steps.gate.outputs.ready == 'true'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

      - name: Deploy frontend
        if: steps.gate.outputs.ready == 'true'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
